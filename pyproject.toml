[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "asrp"
version = "0.1.0"
description = "The deterministic Structure record layer for the ISEE Framework"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Suzanne Daniels" }]
keywords = [
  "agents",
  "architecture",
  "governance",
  "isee",
  "structure",
  "policy-as-code"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/suuus/asrp"
Repository = "https://github.com/suuus/asrp"
Issues = "https://github.com/suuus/asrp/issues"

[project.scripts]
asrp = "asrp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asrp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
